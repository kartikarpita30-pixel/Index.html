 <!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vehicle Loading Management</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}
header{background:#1769aa;color:white;padding:16px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0 0 2px}.sub{font-size:12px;opacity:.9}
.creator{font-size:11px;background:#0d47a1;color:#fff;padding:4px 10px;text-align:right;font-weight:bold}
main{max-width:720px;margin:auto;padding:12px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #00000012}
label{display:block;font-weight:700;font-size:14px;margin:11px 0 6px}
input{width:100%;padding:12px;border:1px solid #cfd6dd;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;padding:12px 14px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#1769aa;color:white;width:100%;margin-top:14px}
.secondary{background:#e9eef3;color:#17202a}
.danger{background:#fde7e7;color:#b42318}
.total{background:#eef7ff;border:1px solid #b8ddfa;padding:13px;border-radius:10px;margin-top:12px;font-size:17px;font-weight:700}
.search{margin-bottom:10px}
.entry{border:1px solid #e1e5e8;border-radius:12px;padding:13px;margin:10px 0}
.entry h3{margin:0 0 8px;font-size:16px}
.muted{color:#65727e;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px}
.empty{text-align:center;color:#65727e;padding:25px 10px}
.step-screen{display:none}
.step-screen.active{display:block}

#loginScreen{position:fixed;inset:0;background:#f4f6f8;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.loginCard{background:#fff;width:100%;max-width:380px;border-radius:16px;padding:24px;box-shadow:0 4px 24px #0002}
.loginCard h2{margin:0 0 6px}.loginSub{color:#65727e;font-size:13px;margin-bottom:18px}
.loginBtn{width:100%;background:#1769aa;color:#fff;margin-top:14px}
.loginError{color:#b42318;font-size:13px;margin-top:10px;display:none}
#appContent{display:none}
.whatsapp{background:#25D366;color:white;width:100%;margin-top:8px}
.summary-box{background:#f8f9fa;border:1px solid #e1e5e8;padding:10px;border-radius:8px;margin-bottom:10px;font-size:14px}
</style>
</head>
<body>

<div class="creator">Create by Kartik</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
<div class="loginCard">
<h2>📦 A BOX PAPER PACK</h2>
<div class="loginSub">🚚 Vehicle Loading Management</div>
<div style="background:#eef7ff;border-radius:9px;padding:10px;margin-bottom:12px;font-size:14px">
Username: <b>Kartik123</b>
</div>
<label>Password</label>
<input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
<button class="loginBtn" onclick="doLogin()">🔐 Login</button>
<div id="loginError" class="loginError">Username या Password गलत है।</div>
</div>
</div>

<!-- MAIN APP CONTENT -->
<div id="appContent">
<header>
  <h1>📦 A BOX PAPER PACK</h1>
  <div class="sub">🚚 Vehicle Loading Management</div>
</header>
<main>

  <!-- SCREEN 1: Party Details -->
  <section id="screen1" class="card step-screen active">
    <h2 style="margin:0 0 10px;font-size:19px">Step 1 — Party Details</h2>
    
    <label>Date</label>
    <input id="date" type="date">
    
    <label>Party Name</label>
    <input id="party" placeholder="पार्टी का नाम">
    
    <label>Vehicle Number</label>
    <input id="vehicle" placeholder="जैसे GJ01AB1234" style="text-transform:uppercase">
    
    <button type="button" class="primary" onclick="goToScreen2()">➡️ Next</button>
    <button type="button" class="secondary" onclick="showScreen(4)" style="width:100%;margin-top:8px">📋 Loading List देखें</button>
  </section>

  <!-- SCREEN 2: Item Details -->
  <section id="screen2" class="card step-screen">
    <h2 style="margin:0 0 10px;font-size:19px">Step 2 — Item Details</h2>
    <div id="items"></div>
    <button type="button" class="secondary" onclick="addItem()" style="width:100%;margin-top:8px">➕ Add Item Code</button>

    <div class="total">Total Box: <span id="grandTotalBox">0</span></div>
    
    <div style="display:flex;gap:10px;margin-top:14px">
      <button type="button" class="secondary" onclick="showScreen(1)" style="flex:1">⬅️ Back</button>
      <button type="button" class="primary" onclick="goToScreen3()" style="flex:2">➡️ Next</button>
    </div>
  </section>

  <!-- SCREEN 3: Confirm & Save -->
  <section id="screen3" class="card step-screen">
    <h2 style="margin:0 0 10px;font-size:19px">Step 3 — Confirm & Save</h2>
    <div id="confirmSummary" style="margin-bottom:14px"></div>

    <div style="display:flex;gap:10px;margin-top:14px">
      <button type="button" class="secondary" onclick="showScreen(2)" style="flex:1">⬅️ Back</button>
      <button type="button" class="primary" onclick="saveEntry()" style="flex:2">💾 Save Loading</button>
    </div>
  </section>

  <!-- SCREEN 4: Loading List -->
  <section id="screen4" class="card step-screen">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0;font-size:19px">📋 Loading List</h2>
      <button type="button" class="primary" onclick="startNewEntry()" style="padding:8px 12px;width:auto">➕ नई एंट्री</button>
    </div>
    <input class="search" id="search" placeholder="Party / Vehicle / Item Code / Date से खोजें..." oninput="render()">
    <div id="summary" class="muted"></div>
    <div id="list"></div>
  </section>

</main>
</div>

<script>
const LOGIN_USER='Kartik123';
const LOGIN_PASS='Abox123';
const KEY='vehicle_loading_entries_v3';
let entries=JSON.parse(localStorage.getItem(KEY)||'[]');

const $=id=>document.getElementById(id);
$('date').value=new Date().toISOString().slice(0,10);

function doLogin(){
 const pw=$('loginPass').value;
 if(LOGIN_USER==='Kartik123' && pw===LOGIN_PASS){
   sessionStorage.setItem('vehicle_logged_in','1');
   $('loginScreen').style.display='none';
   $('appContent').style.display='block';
   $('loginError').style.display='none';
   render();
 } else {
   $('loginError').style.display='block';
 }
}

document.addEventListener('DOMContentLoaded',()=>{
 if(sessionStorage.getItem('vehicle_logged_in')==='1'){
   $('loginScreen').style.display='none';
   $('appContent').style.display='block';
   render();
 }
});

function showScreen(n){
  document.querySelectorAll('.step-screen').forEach(s=>s.classList.remove('active'));
  $(`screen${n}`).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function goToScreen2(){
  const party=$('party').value.trim();
  const date=$('date').value;
  const vehicle=$('vehicle').value.trim();
  
  if(!party || !date || !vehicle){
    alert('Party Name, Date और Vehicle Number भरें।');
    return;
  }
  showScreen(2);
  if($('items').children.length === 0){
    addItem();
  }
}

function goToScreen3(){
  const items = getItems();
  if(!items.length){
    alert('कम से कम एक Item Code डालें।');
    return;
  }
  
  // Build Confirmation Summary HTML
  const party = $('party').value.trim();
  const date = $('date').value;
  const vehicle = $('vehicle').value.trim().toUpperCase();
  
  let html = `<div class="summary-box"><b>Party:</b> ${esc(party)}<br><b>Date:</b> ${esc(date)}<br><b>Vehicle:</b> ${esc(vehicle)}</div>`;
  
  let totalBoxes = 0;
  items.forEach(i => {
    totalBoxes += i.total;
    html += `<div class="summary-box"><b>Item:</b> ${esc(i.code)}<br><b>Bundle:</b> ${i.bundle} | <b>Per Bundle:</b> ${i.perbox}<br><b>Total Box:</b> <b>${i.total}</b></div>`;
  });
  
  html += `<div class="total" style="margin-top:10px">Total Box: ${totalBoxes}</div>`;
  $('confirmSummary').innerHTML = html;
  
  showScreen(3);
}

function startNewEntry(){
  resetForm();
  showScreen(1);
}

function addItem(code='', bundle='', perbox='', bundleParts=null){
 const wrap=document.createElement('div');
 wrap.className='itemrow';
 wrap.style.cssText='border:1px solid #dfe5ea;border-radius:10px;padding:10px;margin:8px 0;background:#fafbfc';
 const parts = (bundleParts && bundleParts.length) ? bundleParts : [Number(bundle||0)];
 wrap.innerHTML=`
 <div>
   <label>Item Code</label><input class="icode" placeholder="Item Code" value="${escAttr(code)}">
 </div>
 <div>
   <label>Per Bundle Box</label>
   <input class="perbox" type="number" min="0" inputmode="numeric" placeholder="0" value="${escAttr(perbox)}">
   <button type="button" class="secondary addbundle" style="width:100%;margin-top:6px">➕ Add Bundle</button>
   <div class="bundleparts"></div>
 </div>
 <div>
   <label>Total Bundle</label>
   <input class="bundle" type="number" min="0" inputmode="numeric" readonly value="${parts.reduce((a,b)=>a+Number(b||0),0)}">
 </div>
 <div>
   <label>Total Box</label><input class="ibox" type="number" readonly value="0">
 </div>
 <button type="button" class="danger" onclick="this.parentElement.remove();calcTotal()" style="width:100%;margin-top:8px">🗑️ Remove Item</button>`;
 
 parts.forEach((v,i)=>addBundlePart(wrap, Number(v||0), i===0));
 wrap.querySelector('.addbundle').addEventListener('click',()=>addBundlePart(wrap,0,false));
 wrap.querySelector('.perbox').addEventListener('input',()=>calcItem(wrap));
 $('items').appendChild(wrap);
 calcItem(wrap); calcTotal();
}

function addBundlePart(wrap, value=0, first=false){
 const box=wrap.querySelector('.bundleparts');
 const row=document.createElement('div');
 row.style.cssText='display:flex;gap:6px;margin-top:6px';
 row.innerHTML=`<input class="bundlepart" type="number" min="0" inputmode="numeric" placeholder="Bundle Qty" value="${value}">
 ${first?'<span></span>':'<button type="button" class="danger" style="padding:8px 12px">✕</button>'}`;
 row.querySelector('.bundlepart').addEventListener('input',()=>calcItem(wrap));
 if(!first) row.querySelector('button').addEventListener('click',()=>{row.remove();calcItem(wrap);});
 box.appendChild(row);
}

function calcItem(wrap){
 let sum=0;
 wrap.querySelectorAll('.bundlepart').forEach(i=>sum+=Number(i.value||0));
 wrap.querySelector('.bundle').value=sum;
 const pb=Number(wrap.querySelector('.perbox').value||0);
 wrap.querySelector('.ibox').value=sum*pb;
}

function calcTotal(){
 let total=0;
 document.querySelectorAll('.itemrow').forEach(r=>total+=Number(r.querySelector('.ibox').value||0));
 $('grandTotalBox').textContent=total;
}

function getItems(){
 return [...document.querySelectorAll('.itemrow')].map(r=>({
   code:r.querySelector('.icode').value.trim(),
   bundle:Number(r.querySelector('.bundle').value||0),
   bundleParts:[...r.querySelectorAll('.bundlepart')].map(i=>Number(i.value||0)),
   perbox:Number(r.querySelector('.perbox').value||0),
   total:Number(r.querySelector('.ibox').value||0)
 })).filter(x=>x.code);
}

function saveEntry(){
 const party=$('party').value.trim();
 const date=$('date').value;
 const vehicle=$('vehicle').value.trim().toUpperCase();
 const items=getItems();
 
 if(!party||!date||!vehicle||!items.length){
   alert('सभी आवश्यक जानकारी भरें।');
   return;
 }
 
 const obj={id:Date.now(),party,date,vehicle,items};
 entries.unshift(obj);
 localStorage.setItem(KEY,JSON.stringify(entries));
 
 resetForm();
 render();
 showScreen(4); // Save होने के बाद Loading List स्क्रीन पर जाएं
}

function resetForm(){
 ['party','vehicle'].forEach(id=>$(id).value='');
 $('date').value=new Date().toISOString().slice(0,10);
 $('items').innerHTML='';
 $('grandTotalBox').textContent='0';
}

function deleteEntry(id){
  const password=prompt('Loading delete करने के लिए password डालें:\nDelete Password:');
  if(password===null)return;
  if(password!=='ABOX1234'){
    alert('गलत password! Loading delete नहीं की गई।');
    return;
  }
  if(confirm('यह Loading delete करनी है?')){
    entries=entries.filter(x=>x.id!==id);
    localStorage.setItem(KEY,JSON.stringify(entries));
    render();
  }
}

function shareWhatsApp(id){
 const x=entries.find(e=>e.id===id); 
 if(!x)return;
 let msg=`Vehicle - ${x.vehicle}`;
 x.items.forEach(i=>{ msg+=`\n${i.code} - ${i.total}`; });
 window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

function render(){
 const q=$('search').value.toLowerCase().trim();
 const arr=entries.filter(x=>[x.party,x.vehicle,x.date,...x.items.map(i=>i.code)].join(' ').toLowerCase().includes(q));
 
 let bundles=0, boxes=0; 
 arr.forEach(x=>x.items.forEach(i=>{bundles+=i.bundle; boxes+=i.total;}));
 
 $('summary').textContent=`${arr.length} entries • ${bundles} bundles • ${boxes} boxes`;
 
 $('list').innerHTML=arr.length?arr.map(x=>`<div class="entry">
<h3>${esc(x.party)} <span class="muted">• ${esc(x.date)}</span></h3>
<div class="muted" style="margin-bottom:8px"><b>Vehicle:</b> ${esc(x.vehicle)}</div>
${x.items.map(i=>`<div style="padding:7px 0;border-top:1px solid #eee"><div class="grid"><div><b>Item:</b> ${esc(i.code)}</div><div><b>Bundle:</b> ${i.bundle}</div><div><b>Per Bundle:</b> ${i.perbox}</div><div><b>Total Box:</b> <b>${i.total}</b></div></div></div>`).join('')}
<div style="margin-top:10px">
  <button class="danger" onclick="deleteEntry(${x.id})" style="width:100%">🗑️ Delete</button>
</div>
<button class="whatsapp" onclick="shareWhatsApp(${x.id})">📲 WhatsApp Share</button>
</div>`).join(''):'<div class="empty">अभी कोई Loading Entry नहीं है।</div>';
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escAttr(s){return esc(s).replace(/`/g,'&#96;');}
</script>
</body>
</html>
